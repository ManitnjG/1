name: OpenMusicPro Build

on:
  push:
    paths:
      - 'OpenMusicPro/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'OpenMusicPro/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

jobs:
  build-with-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build OpenMusicPro with script
        run: |
          chmod +x OpenMusicPro/scripts/build_from_github.sh
          OpenMusicPro/scripts/build_from_github.sh "https://github.com/${{ github.repository }}.git" "${{ github.ref_name }}" "OpenMusicPro"

      - name: Build local workspace (fallback + artifacts)
        working-directory: OpenMusicPro
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openmusicpro-debug-apk
          path: OpenMusicPro/app/build/outputs/apk/debug/*.apk
